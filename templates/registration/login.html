<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вхід — Helpdesk AI</title>
<style>body{font:16px system-ui;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:96vh}form{background:#1e293b;padding:32px;border-radius:14px;width:min(350px,90vw)}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 20px;background:#0f172a;color:white;border:1px solid #64748b;border-radius:7px}button{background:#38bdf8;color:#082f49;border:0;border-radius:8px;padding:12px 24px;font-weight:bold;cursor:pointer}.error{color:#fda4af}</style></head>
<body><form method="post">{% csrf_token %}<h1>Helpdesk AI</h1><p>Вхід оператора</p>{% if form.errors %}<p class="error">Неправильний логін або пароль</p>{% endif %}
<label>Логін<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Увійти</button></form></body></html>
