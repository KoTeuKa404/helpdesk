<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Helpdesk AI · Кабінет оператора</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#0b1220;color:#dae5f4}header{background:#131f33;border-bottom:1px solid #2c3b53;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,4vw,50px)}h1{font-size:22px;margin:0}h2{font-size:18px;margin:4px 0 12px}main{max-width:1250px;margin:auto;padding:24px}nav{display:flex;gap:15px;align-items:center}.hint{color:#8b9eb9}.pill{background:#22324b;color:#9fd3ff;padding:4px 9px;border-radius:30px;font-size:12px;white-space:nowrap}#tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(390px,100%),1fr));gap:17px}.ticket{background:#172338;border:1px solid #33445e;border-radius:14px;padding:20px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px}.meta{color:#93a4bd;font-size:13px;overflow-wrap:anywhere}.body{white-space:pre-wrap;overflow-wrap:anywhere;background:#111b2b;padding:13px;border-radius:8px}.sources{font-size:13px;color:#9fb7ce;margin:10px 0}textarea{width:100%;min-height:145px;background:#0e1727;border:1px solid #4b6584;color:white;border-radius:8px;padding:12px;resize:vertical;font:inherit}button{padding:10px 16px;border-radius:8px;border:0;cursor:pointer;background:#39a8ff;color:#041323;font-weight:600}button.reject{background:#33445e;color:#e6edf9}.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}button:hover{filter:brightness(1.13)}.notice{padding:11px 16px;margin-bottom:18px;border-radius:8px;background:#21364b}.ok{color:#80e0b0}.err{color:#ff9ba7}a{color:#6fc2ff}label{display:block;margin-bottom:6px}#empty{display:none}</style></head>
<body><header><h1>◈ Helpdesk AI <span class="hint" style="font-size:14px">/ модерація</span></h1><nav><span class="meta">{{ request.user.username }}</span><a href="/admin/">Django Admin</a><form method="post" action="/accounts/logout/">{% csrf_token %}<button class="reject" type="submit">Вийти</button></form></nav></header>
<main><div class="notice">Нові звернення автоматично генеруються у фоні. <strong>Жодна чернетка не надсилається без підтвердження оператора.</strong> <span id="updated" class="meta"></span></div><p id="status" class="hint">Завантаження...</p><div id="tickets"></div><p id="empty">Звернень ще немає. Надішліть тестовий webhook.</p></main>
<script>
'use strict';
const api='/api/v1/tickets/'; const csrf=document.querySelector('[name=csrfmiddlewaretoken]').value;const ticketsEl=document.querySelector('#tickets');
const dirty=new Map();
function text(tag,content,cls=''){const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=String(content??'');return node;}
function statusName(value){return ({queued:'У черзі',generating:'LLM генерує...',review:'Очікує рішення',approved:'Підтверджено',rejected:'Відхилено',delivered:'Доставлено',generation_failed:'Помилка LLM',delivery_failed:'Помилка доставки'})[value]||value;}
async function action(ticketId,op,msg){if(!confirm(op==='approve'?'Надіслати підтверджену відповідь?':'Відхилити чернетку?'))return;try{const r=await fetch(api+encodeURIComponent(ticketId)+'/'+op+'/',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf},body:JSON.stringify(op==='approve'?{message:msg}:{})});const b=await r.json();if(!r.ok)throw new Error(b.detail||JSON.stringify(b));dirty.delete(ticketId);await load();}catch(e){alert('Не вдалося виконати дію: '+e.message);}}
function card(ticket){const c=text('article','','ticket');const h=text('div','','head');h.append(text('h2','#'+ticket.ticket_id),text('span',statusName(ticket.status),'pill'));c.append(h);c.append(text('p',ticket.customer_email+' · '+new Date(ticket.created_at).toLocaleString('uk-UA'),'meta'));c.append(text('label','Звернення клієнта','hint'));c.append(text('div',ticket.message,'body'));
if(ticket.knowledge_sources?.length)c.append(text('div','Джерела: '+ticket.knowledge_sources.map(x=>x.title).join(' · '),'sources'));
if(ticket.status==='review'){c.append(text('label','Чернетка LLM (можна редагувати)','hint'));const area=document.createElement('textarea');area.value=dirty.has(ticket.ticket_id)?dirty.get(ticket.ticket_id):ticket.draft;area.addEventListener('input',()=>dirty.set(ticket.ticket_id,area.value));c.append(area);const actions=text('div','','actions');const approve=text('button','✓ Підтвердити');approve.addEventListener('click',()=>action(ticket.ticket_id,'approve',area.value));const reject=text('button','Відхилити','reject');reject.addEventListener('click',()=>action(ticket.ticket_id,'reject'));actions.append(approve,reject);c.append(actions);}
else if(ticket.status==='delivered'||ticket.status==='approved'||ticket.status==='delivery_failed') c.append(text('div',ticket.approved_message,'body'));
if(ticket.generation_error)c.append(text('p',ticket.generation_error,'err'));if(ticket.delivery_status)c.append(text('small',`Доставка: ${ticket.delivery_status}, спроб: ${ticket.attempts}`,'meta'));
return c;}
async function load(){if(document.activeElement?.tagName==='TEXTAREA')return;try{const r=await fetch(api,{credentials:'same-origin'});if(r.status===403){location.href='/accounts/login/';return;}if(!r.ok)throw new Error('HTTP '+r.status);const list=await r.json();ticketsEl.replaceChildren(...list.map(card));document.querySelector('#status').textContent=`Звернень: ${list.length}`;document.querySelector('#empty').style.display=list.length?'none':'block';document.querySelector('#updated').textContent='Оновлено '+new Date().toLocaleTimeString('uk-UA');}catch(e){document.querySelector('#status').textContent='Помилка завантаження: '+e.message;}}
load();setInterval(load,6000);
</script></body></html>
